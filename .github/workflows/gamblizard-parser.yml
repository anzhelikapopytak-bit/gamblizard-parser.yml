name: Gamblizard ES FR Parser

run-name: ${{ inputs.geo }} parser · ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      geo:
        description: Direction
        required: true
        type: choice
        options:
          - ES
          - FR
      spreadsheet_id:
        description: Target Google Spreadsheet ID
        required: true
        type: string
      run_id:
        description: Unique run ID from Apps Script
        required: true
        type: string
      run_mode:
        description: FULL, MONTHLY_FRESH or RETRY_FAILED
        required: false
        default: FULL
        type: choice
        options:
          - FULL
          - MONTHLY_FRESH
          - RETRY_FAILED
      month:
        description: Month for MONTHLY_FRESH in YYYY-MM format
        required: false
        default: ""
        type: string
      clear_missing:
        description: Clear Missing Brands and Missing Categories before run
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: gamblizard-${{ inputs.geo }}-${{ inputs.spreadsheet_id }}
  cancel-in-progress: false

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      GEO: ${{ inputs.geo }}
      SPREADSHEET_ID: ${{ inputs.spreadsheet_id }}
      RUN_ID: ${{ inputs.run_id }}
      RUN_MODE: ${{ inputs.run_mode }}
      RUN_MONTH: ${{ inputs.month }}
      CLEAR_MISSING: ${{ inputs.clear_missing }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      HEADLESS: "false"
      REQUEST_TIMEOUT_SECONDS: "60"
      BROWSER_TIMEOUT_SECONDS: "120"
      AUTOMATIC_CHALLENGE_WAIT_SECONDS: "35"
      MAX_DEPTH: "12"
      MAX_SITEMAPS_PER_SITE: "5000"
      MAX_URLS_PER_SITE: "500000"
      MAX_HTML_PAGES_PER_SITE: "25000"
      HTML_WORKERS: "12"
      HTML_TIMEOUT_SECONDS: "35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets and inputs
        shell: bash
        run: |
          test -n "$SPREADSHEET_ID" || { echo "SPREADSHEET_ID is empty"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "GOOGLE_SERVICE_ACCOUNT_JSON secret is empty"; exit 1; }
          test "$GEO" = "ES" -o "$GEO" = "FR" || { echo "GEO must be ES or FR"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run parser
        run: xvfb-run -a python -m parser.main

      - name: Upload raw sitemap backups and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.geo }}-parser-${{ inputs.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
